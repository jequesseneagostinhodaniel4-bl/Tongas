services:
    - type: web
    name: tongas
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
            - key: SECRET_KEY
        generateValue: true
            - key: ADMIN_PASSWORD
        sync: false
            - key: PYTHON_VERSION
        value: 3.11.0