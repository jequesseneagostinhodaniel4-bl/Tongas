<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tongas - Entrar</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;transition:.3s}
body[data-tema="claro"]{background:linear-gradient(135deg,#ff6b00,#ffb347)}
body[data-tema="escuro"]{background:linear-gradient(135deg,#000,#1a1a1a,#333)}
body[data-role="admin"]{--acc:#ff6b00} body[data-role="funcionario"]{--acc:#00a651} body[data-role="cliente"]{--acc:#1e90ff}
body[data-role="admin"] .box h1{color:#ff6b00} body[data-role="funcionario"] .box h1{color:#00a651} body[data-role="cliente"] .box h1{color:#1e90ff}
body[data-tema="escuro"] .box{background:#1e1e1e;color:#fff} body[data-tema="escuro"] .box input{background:#2a2a2a;color:#fff;border-color:#444}
.box{background:#fff;width:400px;max-width:95vw;padding:28px;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center}
.box img{width:130px;height:130px;object-fit:contain;border-radius:18px}
.box h1{letter-spacing:3px;font-size:30px} .box p{color:#888;font-size:13px;margin:6px 0 16px}
.top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.temas{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.temas button{border:2px solid #eee;background:#f8f8f8;padding:7px 12px;border-radius:20px;cursor:pointer;font-weight:700;font-size:12px}
.temas button.ativo{background:var(--acc,#ff6b00);color:#fff;border-color:var(--acc,#ff6b00)}
input,select{width:100%;padding:13px;margin-bottom:11px;border:2px solid #eee;border-radius:12px;outline:none;font-size:15px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--acc,#ff6b00);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.btn2{width:100%;padding:12px;border:2px solid #eee;border-radius:12px;background:#fff;cursor:pointer;font-weight:700;margin-top:10px}
#msg{color:#e74c3c;font-size:13px;margin:8px 0;min-height:18px}
</style></head>
<body data-tema="claro" data-role="admin">
<div class="box">
<div class="top-row"><span>🍔 <b>TONGAS</b></span><button onclick="trocarClaroEscuro()" id="btnCE" style="border:none;background:#eee;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700">🌙 Escuro</button></div>
<img src="/static/imagem/logo.jpg" onerror="this.style.display='none'"><h1>TONGAS</h1><p>Lanchonete & BBQ • Matola • Moçambique</p>
<div class="temas"><button onclick="setRole('admin',this)" class="ativo">🟠 Admin</button><button onclick="setRole('funcionario',this)">🟢 Funcionário</button><button onclick="setRole('cliente',this)">🔵 Cliente</button></div>
<div id="loginBox"><input id="tel" placeholder="📱 Telefone: 840000000"><input id="sen" type="password" placeholder="🔒 Senha"><button class="btn" onclick="entrar()">ENTRAR →</button><button class="btn2" onclick="mostrarCriar()">Criar Conta</button><p style="margin-top:10px">Admin: 840000000 / Tongas12345</p></div>
<div id="criarBox" style="display:none"><input id="cNome" placeholder="👤 Nome completo"><input id="cTel" placeholder="📱 Telefone"><input id="cSenha" type="password" placeholder="🔒 Criar senha (4+)"><select id="cTipo"><option value="Cliente">Cliente</option><option value="Funcionário">Funcionário</option><option value="Admin">Admin</option></select><button class="btn" onclick="criar()">CRIAR CONTA →</button><button class="btn2" onclick="mostrarLogin()">Voltar para Entrar</button></div>
<div id="msg"></div></div>
<script>
let role='admin';
function setRole(r,b){role=r;document.body.setAttribute('data-role',r);document.querySelectorAll('.temas button').forEach(x=>x.classList.remove('ativo'));b.classList.add('ativo');localStorage.setItem('tongas_role',r)}
function trocarClaroEscuro(){let t=document.body.getAttribute('data-tema');let n=t==='escuro'?'claro':'escuro';document.body.setAttribute('data-tema',n);document.getElementById('btnCE').innerText=n==='escuro'?'☀️ Claro':'🌙 Escuro';localStorage.setItem('tongas_tema',n)}
let ts=localStorage.getItem('tongas_tema')||'claro';document.body.setAttribute('data-tema',ts);if(ts==='escuro')document.getElementById('btnCE').innerText='☀️ Claro';
let rs=localStorage.getItem('tongas_role')||'admin';document.body.setAttribute('data-role',rs);
function mostrarCriar(){document.getElementById('loginBox').style.display='none';document.getElementById('criarBox').style.display='block'}
function mostrarLogin(){document.getElementById('criarBox').style.display='none';document.getElementById('loginBox').style.display='block'}
async function entrar(){let tel=document.getElementById('tel').value;let sen=document.getElementById('sen').value;let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telefone:tel,password:sen})});let j=await r.json();if(!r.ok){document.getElementById('msg').innerText=j.detail||'Erro';return}localStorage.setItem('tongas_token',j.token);localStorage.setItem('tongas_user',JSON.stringify(j.user));window.location.href='/dashboard'}
async function criar(){let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:document.getElementById('cNome').value,telefone:document.getElementById('cTel').value,password:document.getElementById('cSenha').value,tipo:document.getElementById('cTipo').value})});let j=await r.json();if(!r.ok){document.getElementById('msg').innerText=j.detail||'Erro';return}localStorage.setItem('tongas_token',j.token);window.location.href='/dashboard'}
</script></body></html>
